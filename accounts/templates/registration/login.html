{% extends "base.html" %}

{% block title %}Log in | GGz{% endblock %}

{% block content %}
<main class="page-shell form-page">
    <div class="form-card">
        <a class="back-link" href="{% url 'index' %}">&larr; Back to GGz</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Return to the lobby.</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="button" type="submit">Log in</button>
        </form>
        <p class="muted">New to GGz? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</main>
{% endblock %}
