{% extends "base.html" %}

{% block title %}Reset password | GGz{% endblock %}

{% block content %}
<main class="page-shell form-page auth-stage">
    <div class="auth-card">
        <a class="back-link" href="{% url 'login' %}">&larr; Back to login</a>
        <p class="eyebrow">Need a reset?</p>
        <h1>Reset your password.</h1>
        <form method="post" class="auth-form" data-form-submit-state>
            {% csrf_token %}
            <div class="field-group">
                <label for="{{ form.email.id_for_label }}">Email address</label>
                {{ form.email }}
                {% if form.email.errors %}<div class="field-error">{{ form.email.errors|join:' ' }}</div>{% endif %}
            </div>
            <button class="button button-primary auth-submit" type="submit">Send reset link</button>
        </form>
    </div>
</main>
{% endblock %}
