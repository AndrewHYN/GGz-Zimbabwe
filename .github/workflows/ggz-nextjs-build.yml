name: GGz Next.js Build

on:
  push:
    branches:
      - main
      - feat/ggz-nextjs-ui-2
      - feat/ggz-local-competition-launch
  pull_request:
    branches:
      - main
      - feat/ggz-nextjs-ui-2
      - feat/ggz-local-competition-launch

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Production build
        run: npm run build
