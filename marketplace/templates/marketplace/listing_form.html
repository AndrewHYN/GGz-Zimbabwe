{% extends "base.html" %}
{% block title %}{{ title }} | Marketplace{% endblock %}
{% block content %}<main class="page-shell form-page"><a class="back-link" href="{% url 'listing_list' %}">&larr; Back to marketplace</a><div class="form-card"><p class="eyebrow">Marketplace</p><h1>{{ title }}</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<p><label for="id_images">Photos</label><input id="id_images" name="images" type="file" accept="image/*" multiple></p><button class="button" type="submit">Save listing</button></form></div></main>{% endblock %}
