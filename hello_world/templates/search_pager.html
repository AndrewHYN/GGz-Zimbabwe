{% if page.has_other_pages %}<nav class="pagination search-pagination" aria-label="{{ key }} result pages">{% if page.has_previous %}<a href="?{{ pager_query }}&{{ key }}_page={{ page.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ pager_query }}&{{ key }}_page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
