{% extends "base.html" %}
{% block title %}Create team | GGs{% endblock %}
{% block content %}<main class="page-shell form-page"><a class="back-link" href="{% url 'team_list' %}">&larr; Back to teams</a><div class="form-card"><p class="eyebrow">Squad builder</p><h1>Create a team.</h1><form method="post">{% csrf_token %}<p><label for="id_name">Team name</label><input id="id_name" name="name" required maxlength="100"></p><p><label for="id_tag">Team tag</label><input id="id_tag" name="tag" maxlength="12" value="GGZ"></p><p><label for="id_description">Description</label><textarea id="id_description" name="description" rows="5"></textarea></p><button class="button" type="submit">Create team</button></form></div></main>{% endblock %}
